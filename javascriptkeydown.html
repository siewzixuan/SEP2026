<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript</title>
        <link rel="icon" type="image/jpg" href="sunder-muthukumaran-fd6K_OFlnRA-unsplash.jpg">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>
            window.addEventListener("keydown", checkKeyDown, false);
            function checkKeyDown(event) {
                //alert(event.key)
                alert("keyCode=" + event.keyCode + ", key=" + event.key);
                if (event.keyCode == "ArrowLeft") {
                    alert("The Arrow Left key has been pressed!");
                }
            };
        </script>
    </head>
    <body>
        <h1>Keyboard Events - keyDown in JavaScript</h1>
        <p>
            keyCode : ArrowLeft = an arrow left key on keyboard
        </p>
    </body>
</html>
