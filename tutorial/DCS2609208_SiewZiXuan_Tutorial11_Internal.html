<!DOCTYPE HTML>
<html>
<head>
<title>Tutorial 11 Inline CSS</title>
<link rel=icon href=sunder-muthukumaran-fd6K_OFlnRA-unsplash.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
<style>
    body {
        h1 {
            letter-spacing: 5px; /*1. Letter Spacing*/
            text-shadow: 3px 3px 3px gray; /*2. Text Shadow*/
        }

        .p1 {
            opacity: 0.4; /*3. Opacity*/
            text-transform: uppercase; /*4. Text Transform*/
        }

        .p1 font {
            text-decoration: underline; /*5. Text Decoration*/
        }

        .p2 {
            border: 2px solid black;
            border-radius: 25px; /*6. Border Radius*/
            box-shadow: 3px 3px 3px gray; /*7. Box Shadow*/
        }

        .p3 {
            filter: blur(1px); /*8. Filter*/
            text-indent: 50px; /*9. Text Indent*/
        }

        .p3 font {
            font-variant: small-caps; /*10. Font Variant*/
        }
    }
</style>
</head>
<body>
<h1>JavaScript</h1>
<p class="p1">
<font>JavaScript</font> is a scripting or programming language that allows you to implement complex features on web pages.
</p><p class="p2">
It works seamlessly alongside HTML and CSS.
</p>
<p class="p3">
<font>JavaScript's</font> widespread applications in web, mobile app, and game development make it a valuable language to learn.
</p>
</body>
</html>
