<!DOCTYPE HTML>
<html>
<head>
<title>Cartoon</title>
<link rel=icon href=sunder-muthukumaran-fd6K_OFlnRA-unsplash.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
<script>
    function bigImg(x) {
        x.style.height = "300px";
        x.style.width = "440px";
    }
    function normalImg(x) {
        x.style.height = "50%";
        x.style.width = "50%";
    }
    function changeColor(newColor) {
        const tochange = document.getElementById("textcolor");
        tochange.style.color = newColor; 
    }
    function changeShadow(newShadow) {
        const tochange = document.getElementById("textshadow");
        tochange.style.textShadow = newShadow; 
    }
    function changeBackground(newBackground) {
        const tochange = document.getElementById("textbackground");
        tochange.style.backgroundColor = newBackground; 
    }
</script>
</head>
<body topmargin=20 leftmargin=50>

<table border=3 width="50%" and height="50%" align="center">
<caption>My First Web Table</caption>
<tr>
<th>header one</th>
<th>header two</th>
<th>header three</th>
<th>header four</th>
<th>header five</th>
</tr>

<tr>
<td onclick="bigImg(this)" onmouseout="normalImg(this)">data row1-col1</td>
<td onmouseover="changeColor('red')" onmouseout="changeColor('black')" id="textcolor">data row1-col2</td>
<td ondblclick="changeShadow('2px 2px 4px rgba(0, 0, 0, 0.5)')" onmouseout="changeShadow('none')" id="textshadow">data row1-col3</td>
<td onclick="changeBackground('yellow')" onmouseout="changeBackground('white')" id="textbackground">data row1-col4</td>
<td>data row1-col5</td>
</tr>

<tr>
<td>data row2-col1</td>
<td>data row2-col2</td>
<td>data row2-col3</td>
<td>data row2-col4</td>
<td>data row2-col5</td>
</tr>

<tr>
<td>A</td>
<td>B</td>
<td>C</td>
<td>D</td>
<td>E</td>
</tr>

</table>

</body>
</html>
