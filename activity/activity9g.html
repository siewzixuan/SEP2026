
<!DOCTYPE HTML>
<html>
<head>
<title>Form - Text Input</title>

<link rel=icon href=sunder-muthukumaran-fd6K_OFlnRA-unsplash.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
</head>
<body topmargin="50">
<center>
    <form>
        <table cellpadding="8" style="background-color: powderblue; color: #696969; font-family: Verdana; width: 60%;">
            <tr>
                <th colspan="2" style="font-size: 160%; text-align: center;">Personal details</th>
            </tr>
            <tr>
                <td><label for="fname">First Name:</label></td>
                <td><input type="text" id="fname" name="fname" size="40" maxlength="5"></td>
            </tr>
            <tr>
                <td><label for="lname">Last Name:</label></td>
                <td><input type="text" id="lname" name="lname"></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td>
                    <label><input type="radio" name="gender" value="Male"> Male</label>
                    <label><input type="radio" name="gender" value="Female"> Female</label>
                </td>
            </tr>
            <tr>
                <td>Favourite subjects:</td>
                <td>
                    <label><input type="checkbox" name="fav_sub" value="DCS4103"> DCS4103</label>
                    <label><input type="checkbox" name="fav_sub" value="DCS3003"> DCS3003</label>
                    <label><input type="checkbox" name="fav_sub" value="MST1003"> MST1003</label>
                    <label><input type="checkbox" name="fav_sub" value="MST2003"> MST2003</label>
                </td>
            </tr>
            <tr>
                <td><label for="address">Address:</label></td>
                <td><textarea id="address" rows="4" cols="30" name="address"></textarea></td>
            </tr>
            <tr>
                <td><label for="dob">Date of Birth:</label></td>
                <td><input type="date" id="dob" name="dob"></td>
            </tr>
            <tr>
                <td><label for="loginpass">Login password:</label></td>
                <td><input type="password" id="loginpass" name="loginpass"></td>
            </tr>
            <tr>
                <td><label for="course">Course:</label></td>
                <td>
                    <select id="course" name="course">
                        <option value="0">- List of Courses -</option>
                        <optgroup label="Diploma in Computer Science">
                            <option value="DCS_S1">Semester 1</option>
                            <option value="DCS_S2">Semester 2</option>
                            <option value="DCS_S3">Semester 3</option>
                            <option value="DCS_S4">Semester 4</option>
                            <option value="DCS_S5">Semester 5</option>
                            <option value="DCS_S6">Semester 6</option>
                        </optgroup>
                        <option value="DIB">Diploma in Business</option>
                        <option value="DAS">Diploma in Airline Services</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</center>
</body>
</html>
