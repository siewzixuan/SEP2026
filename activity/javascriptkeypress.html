<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript</title>
        <link rel="icon" type="image/jpg" href="sunder-muthukumaran-fd6K_OFlnRA-unsplash.jpg">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>
            window.addEventListener("keypress", checkKeyPress, false);
            function checkKeyPress(key) {
                if (key.keyCode == 97) {
                    alert("The 'a' lower case has been pressed!");
                }
            };
        </script>
    </head>
    <body>
        <h1>Keyboard Events - KeyPress in JavaScript</h1>
        <p>
            keyCode : 97 = a (lower case) on keyboard
        </p>
    </body>
</html>
