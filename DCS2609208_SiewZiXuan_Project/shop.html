<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | AUREVÉ</title>
    <link rel="icon" href="website-icon.png" type="image/png">
    <link rel="stylesheet" href="site.css">
    <script src="site.js" defer></script>
</head>
<body data-page="shop">
<main>

<section class="page-banner"><div class="container"><h1>The Collection</h1><p>Reds, whites, rosés and sparkling, all worth savouring.</p></div></section>
<section class="section">
    <div class="container">
        <div class="toolbar">
            <div class="filters" id="filters">
                <button class="chip active" data-type="All">All</button>
                <button class="chip" data-type="Red">Red</button>
                <button class="chip" data-type="White">White</button>
                <button class="chip" data-type="Rosé">Rosé</button>
                <button class="chip" data-type="Sparkling">Sparkling</button>
            </div>
        </div>
        <div class="grid" id="shopGrid"></div>
    </div>
</section>
</main>
</body>
</html>
