<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | AUREVÉ</title>
    <link rel="icon" href="website-icon.png" type="image/png">
    <link rel="stylesheet" href="site.css">
    <script src="site.js" defer></script>
</head>
<body data-page="cart">
<main>

<section class="page-banner"><div class="container"><h1>Your Cart</h1><p>Review your selection before checkout.</p></div></section>
<section class="section">
    <div class="container cart-layout">
        <div id="cartList"></div>
        <aside class="summary" id="summary">
            <h3>Order Summary</h3>
            <div class="row"><span>Subtotal</span><span id="sub"></span></div>
            <div class="row"><span>Shipping</span><span id="ship"></span></div>
            <small id="shipNote" style="color:#786d7d"></small>
            <div class="row total"><span>Total</span><span id="total"></span></div>
            <button class="btn" id="checkout">Checkout</button>
        </aside>
    </div>
</section>
</main>
</body>
</html>
